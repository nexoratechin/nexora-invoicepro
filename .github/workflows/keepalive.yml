name: Keep the free API awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          API_URL: ${{ vars.PROD_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "PROD_API_URL is not set as a repository variable. Skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$API_URL/health")
          echo "GET $API_URL/health -> $code"
          test "$code" = "200"
